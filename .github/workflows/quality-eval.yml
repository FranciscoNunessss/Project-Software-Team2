name: Quality evaluation
# A quality eval with a real model, not a contract test: it scores the task profile against the
# expected levels of the labelled task set and compares the result with the last baseline
# (backend/eval/quality/baselines). A drop of more than 5 percentage points fails the job unless
# the Architecture Owner accepted it in an ADR (backend/eval/quality/accepted.json).
# If there is no key the job ends neutral with a warning annotation; if there IS a key and nothing
# could be measured (provider down) the job fails, so a green check always means "measured".
# The key is EVAL_GROQ_API_KEY: a separate Groq account from production, so that CI never spends
# the quota of the users (8000 tokens a minute).
# Docs: docs/quality-eval.md
on:
  pull_request:
    paths:
      - "backend/app/assessment.py"
      - "backend/app/prompt_builder.py"
      - "backend/app/recommendation.py"
      - "backend/app/workflow.py"
      - "backend/rubric/**"
      - "backend/data/catalogue/**"
      - "backend/eval/quality/**"
      - "scripts/run_quality_eval.py"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full set with 3 repeats (before a milestone)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVAL_PROVIDER: groq
      EVAL_MODEL: openai/gpt-oss-20b  # the model production assesses with
      ADAPTAI_GROQ_API_KEY: ${{ secrets.EVAL_GROQ_API_KEY }}
      # The runner reads only this name for Groq, so it can never pick up a production key.
      EVAL_GROQ_API_KEY: ${{ secrets.EVAL_GROQ_API_KEY }}
      HAS_EVAL_KEY: ${{ secrets.EVAL_GROQ_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run the evaluation
        run: |
          mode="--subset"
          if [ "${{ inputs.full }}" = "true" ]; then mode="--repeats 3"; fi
          set +e
          uv run python scripts/run_quality_eval.py run --provider "$EVAL_PROVIDER" --model "$EVAL_MODEL" $mode
          code=$?
          # 3 is NOT RUN. Without the secret: a warning and a neutral end (forks cannot read it).
          # With the secret: a failure, because a check that measured nothing must not look green.
          if [ "$code" -eq 3 ]; then
            if [ "$HAS_EVAL_KEY" != "true" ]; then
              echo "::warning title=Quality eval NOT RUN::EVAL_GROQ_API_KEY is not set; nothing was measured."
              exit 0
            fi
            echo "::error title=Quality eval NOT RUN::The key is set but the run could not measure (provider outage or more than 10% failed)."
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-eval-report
          path: backend/eval/quality/reports/
          if-no-files-found: ignore
          retention-days: 30
