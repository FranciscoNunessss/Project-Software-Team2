name: Catalogue sources
# Fetches the public facts and the benchmark snapshot that a new catalogue version is built
# from (ADR-014, docs/model-classification.md). On a data/** branch it also commits the
# files to that branch; a person reviews them and builds the new catalogue version in a
# pull request. Nothing reaches develop or main from here.
on:
  workflow_dispatch:
  push:
    branches: ["data/**"]
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: OpenRouter facts (public, no key)
        run: uv run python scripts/import_openrouter_facts.py
      - name: LMArena snapshot (public, no key, CC BY 4.0)
        run: uv run --with pyarrow==17.0.0 python scripts/snapshot_lmarena.py
      - name: Artificial Analysis snapshot (needs the ARTIFICIAL_ANALYSES_ADAPTAI repository secret)
        env:
          ADAPTAI_AA_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSES_ADAPTAI }}
        run: |
          if [ -z "$ADAPTAI_AA_API_KEY" ]; then
            echo "ARTIFICIAL_ANALYSES_ADAPTAI secret not set: benchmark snapshot skipped"
          else
            uv run python scripts/snapshot_benchmarks.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-sources
          path: backend/data/catalogue/sources/
          retention-days: 30
      - name: Commit the sources to the data branch
        if: startsWith(github.ref, 'refs/heads/data/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backend/data/catalogue/sources/
          git diff --cached --quiet || git commit -m "Catalogue sources $(date -u +%F)"
          git pull --rebase && git push
