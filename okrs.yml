# OKR Pulse — single source of truth for the team's OKRs.
# Source: 01 Process Charter v0.17 (18 Nov 2026), section 7 "OKRs". Values measured on 18 Nov 2026
# from GitHub and ClickUp; owners are the people named in the charter.
# Schema: okr-pulse/schema/okrs.schema.json  ·  Validate: cd okr-pulse && npm run validate
#
# Objectives and targets live here (and in the charter). Measured values of manual KRs
# are copied here by the KR owner at the weekly replenishment, from the
# "OKRs & Improvement (GCI)" tab of the DA spreadsheet; never invent a value.
# A KR without a measured value keeps `value: null` and shows as "sem dados".

version: 1
repo: FranciscoNunessss/Project-Software-Team2
branch: develop

semester:
  # Monday of week 1. Derived from the charter ("4 November 2026, in week 8").
  start_date: 2026-09-14
  weeks: 15
  milestones:
    - { name: First Interview, week: 2 }
    - { name: Kick-off, week: 6 }
    - { name: Walking skeleton, week: 7 }
    - { name: Proven Architecture, week: 8 }
    - { name: Continued Viability, week: 9 }
    - { name: Sufficient Functionality, week: 10 }
    - { name: MVP, week: 11 }
    - { name: Final Delivery, week: 15 }

settings:
  at_risk_gap: 10     # expected − progress > 10 pp → at risk
  behind_gap: 25      # expected − progress > 25 pp → behind
  docs_stale_days: 14

# Repository documents shown under "Saúde da documentação".
# The charter, ADRs and specifications live on Google Drive and are not tracked here.
docs_health:
  - README.md
  - GIT_WORKFLOW.md
  - docs/memory-privacy.md

objectives:
  - id: T1
    title: The Assistant right-sizes each user's model choice from the first task
    description: Supports O1; verified through the O3 practices.
    supports: [O1, O3]
  - id: T2
    title: The Educator makes users measurably more independent
    description: Supports O1.
    supports: [O1]
  - id: T3
    title: Our AI-assisted way of working is disciplined, evidenced and improving
    description: Supports O2 and O3.
    supports: [O2, O3]

key_results:
  # ---------------- T1 ----------------
  - id: KR1.1
    objective_id: T1
    title: At least 16 of 20 recommendations judged correct in a blind review by people outside the team
    owner: Ricardo Rodrigues
    type: manual
    unit: "/20"
    start_week: 7
    checkpoints:
      - { milestone: MVP, target: 16 }
      - { milestone: Final Delivery, target: 16 }
    value: null
    note: >-
      Not measured: the 20-task set has no human labels and no outside reviewers yet. A team
      study gave 83% of levels right on 24 tasks (288 analyses, 15 Nov); it is not an outside review.
    updated: 2026-11-18
    evidence:
      - title: "PR #22 — graded recommendation with fit per tier"
        url: https://github.com/FranciscoNunessss/Project-Software-Team2/pull/22

  - id: KR1.2
    objective_id: T1
    title: Following the recommendations costs at most half of always using the top tier
    owner: José Moura
    type: manual
    unit: "% of top-tier cost"
    direction: lower
    baseline: 100
    start_week: 7
    target: 50
    due: MVP
    value: null
    note: Not measured. Measurable since ADR-014 (real, dated OpenRouter prices); ClickUp card "KR1.2 · First measurement".
    updated: 2026-11-18

  - id: KR1.3
    objective_id: T1
    title: A non-developer gets a first explained recommendation unaided, with no setup step
    owner: Ricardo Rodrigues
    type: manual
    unit: people
    start_week: 7
    checkpoints:
      - { milestone: MVP, target: 1 }
      - { milestone: Final Delivery, target: 3 }
    value: null
    note: 0 sessions. One session with a non-developer before the MVP review (card AA-015).
    updated: 2026-11-18
    evidence:
      - title: "PR #18 — Prompt Coach (helps a new user describe the task)"
        url: https://github.com/FranciscoNunessss/Project-Software-Team2/pull/18

  # ---------------- T2 ----------------
  - id: KR2.1
    objective_id: T2
    title: The three patterns are detected in simulated histories, with no detection in control histories
    owner: Francisco Velhinho
    type: manual
    unit: "of 3 patterns"
    start_week: 7
    checkpoints:
      - { milestone: MVP, target: 1 }
      - { milestone: Final Delivery, target: 3 }
    value: 2
    note: >-
      2 of 3 in code (over- and under-provisioning), 0 of 7 control histories flagged (PR #60, in
      review, not on main); evaluation of the prompt sentence in PR #80. Inflated prompting has no rule.
    updated: 2026-11-18
    evidence:
      - title: "PR #60 — Educator pattern rule with synthetic histories"
        url: https://github.com/FranciscoNunessss/Project-Software-Team2/pull/60

  - id: KR2.2
    objective_id: T2
    title: For at least two simulated profiles, the user's own choice matches the recommended tier more often over time
    owner: Francisco Velhinho
    type: manual
    unit: profiles
    start_week: 7
    target: 2
    due: Final Delivery
    value: null
    note: "Not measured on simulated profiles. My progress computes agreement on saved sessions (PR #12, #25); run 2 profiles after #60 is released."
    updated: 2026-11-18
    evidence:
      - title: "PR #12 — recommendation agreement in My progress"
        url: https://github.com/FranciscoNunessss/Project-Software-Team2/pull/12

  - id: KR2.3
    objective_id: T2
    title: Every detected pattern produces a specific suggestion that the client judges specific rather than generic
    owner: Ricardo Rodrigues
    type: manual
    unit: "% of patterns built"
    start_week: 7
    checkpoints:
      - { milestone: MVP, target: 100 }
      - { milestone: Final Delivery, target: 100 }
    value: null
    note: Not judged by the client. On 17 Nov the client asked for much better personal guidance (card "Educator · Personalised guidance").
    updated: 2026-11-18

  # ---------------- T3 ----------------
  - id: KR3.1
    objective_id: T3
    title: Every significant AI-assisted contribution is disclosed where the Learning Agreement requires it
    owner: José Moura
    type: manual
    unit: "% disclosed"
    start_week: 7
    pace: constant          # 100% every week from week 7, not a ramp
    target: 100
    due: Final Delivery
    value: 89
    note: 49 of 55 merged pull requests carry an AI co-author trailer in their commits (18 Nov); the other 6 not checked one by one.
    updated: 2026-11-18

  - id: KR3.2
    objective_id: T3
    title: Each process change is tried and closed (adopted or dropped) within two weeks
    owner: Francisco Velhinho
    type: manual
    unit: "% of changes"
    start_week: 7
    pace: constant
    target: 100
    due: Final Delivery
    value: 100
    note: >-
      Revised on 18 Nov (the one mid-semester revision). Original: "Every week ends with a recorded
      improvement-review outcome; every experiment reaches adopt/adapt/abandon within two weeks";
      0 of 4 weeks were recorded. Now: 1 of 1 change closed (PD-43); PD-44, PD-45, PD-47, PD-48 open since 18 Nov.
    updated: 2026-11-18

  - id: KR3.3
    objective_id: T3
    title: At least 1 written review finding per AI-assisted pull request
    owner: José Moura
    type: manual
    unit: "findings per pull request"
    start_week: 11
    pace: constant
    target: 1
    due: Final Delivery
    value: 0
    note: >-
      Revised on 18 Nov (the one mid-semester revision). Original: "Review changes requested per
      AI-assisted pull request fall by at least a third (weeks 7–8 → weeks 10–11)", measured with
      type pr_reviews; with 2 change requests in 81 pull requests there was nothing to fall.
      Now: 0 findings written by a person in 81 pull requests (18 Nov); PD-44 requires one per approval.
    updated: 2026-11-18
