name: Secret scan
# Looks for credentials in what a pull request adds (AI Integration Policy 2.2: no keys in code or
# prompts). It scans the commits of the pull request or push, not the whole history, so an old
# finding does not block new work; run it by hand with "full history" to audit everything.
# The scanner is a pinned release of gitleaks, checked against its published SHA-256.
# Docs: docs/secret-scanning.md
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      full_history:
        description: "Scan the whole history instead of the new commits"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          FULL: ${{ inputs.full_history }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ]; then range="${BASE_SHA}..${HEAD_SHA}"; fi
          if [ "$EVENT" = "push" ] && [ "${BEFORE_SHA#0000000}" = "$BEFORE_SHA" ]; then range="${BEFORE_SHA}..${PUSH_SHA}"; fi
          if [ "$FULL" = "true" ]; then range=""; fi
          echo "Scanning: ${range:-the whole history}"
          # --redact: a finding is never printed in the log.
          if [ -n "$range" ]; then
            ./gitleaks git --redact --no-banner --verbose --log-opts="$range" .
          else
            ./gitleaks git --redact --no-banner --verbose .
          fi
