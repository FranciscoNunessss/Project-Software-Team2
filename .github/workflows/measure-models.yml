name: Measure models
# Runs the automatic measurement suite (measure-suite-1, ADR-014) against every catalogue
# model the repository secrets can reach, and commits the run files to the data branch.
# Only on data/measure-* branches; nothing reaches develop or main without a pull request.
# Secrets (optional, each enables its provider): GROQ_API_KEY, and OPENROUTER_EVALUATION_KEY
# (the project's evaluation-only key, A10 layer 3) or else OPENROUTER_API_KEY.
# Paid models are skipped unless the commit message contains [allow-paid].
on:
  push:
    branches: ["data/measure-*"]
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Measure
        env:
          ADAPTAI_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADAPTAI_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_EVALUATION_KEY || secrets.OPENROUTER_API_KEY }}
          PAID: ${{ contains(github.event.head_commit.message, '[allow-paid]') }}
        run: |
          if [ "$PAID" = "true" ]; then extra="--allow-paid"; else extra=""; fi
          uv run python scripts/measure_models.py $extra
      - name: Commit the runs to the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backend/eval/measure/runs/
          git diff --cached --quiet || git commit -m "Measurement runs $(date -u +%F)"
          git push
