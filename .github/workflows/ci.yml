name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prompt_coach: ["false", "true"]
    env:
      ADAPTAI_PROMPT_COACH_ENABLED: ${{ matrix.prompt_coach }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m ruff check backend scripts
      - run: uv run python -m ruff format --check backend scripts
      - run: uv run python -m pytest -q
  removal-drill:
    # Proves the optional Prompt Coach (ADR-009) can be deleted without touching the core.
    runs-on: ubuntu-latest
    env:
      ADAPTAI_PROMPT_COACH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Delete the Prompt Coach module
        run: >-
          rm -f backend/app/prompt_coach.py backend/tests/test_prompt_coach*.py
          scripts/check_prompt_coach.py
      - run: uv run python -m pytest -q -m "not prompt_coach"
      - name: Start over a database that still has Prompt Coach data
        env:
          ADAPTAI_DATABASE_PATH: ${{ runner.temp }}/drill.sqlite3
          ADAPTAI_CREDENTIALS_KEY_PATH: ${{ runner.temp }}/drill.key
        run: |
          uv run python - <<'PY'
          import os
          import sqlite3

          with sqlite3.connect(os.environ["ADAPTAI_DATABASE_PATH"]) as db:
              db.execute("CREATE TABLE prompt_coach_events (id TEXT PRIMARY KEY, payload TEXT)")
              db.execute("INSERT INTO prompt_coach_events VALUES ('drill', '{}')")
          PY
          cd backend
          uv run python - <<'PY'
          from app.main import create_app
          from fastapi.testclient import TestClient

          response = TestClient(create_app()).get("/api/health")
          assert response.status_code == 200, response.text
          print("health", response.json())
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
