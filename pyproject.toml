[project]
name = "adaptai"
version = "0.1.0"
description = "AdaptAI task complexity assessment and model recommendation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-anthropic>=1,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = ["acceptance: externally observable requirement scenarios (ATDD)"]

# Core-logic coverage (Construction §3): complexity assessment and recommendation only.
# Interface and glue code (main.py, providers.py, scripts) is deliberately out of scope.
[tool.coverage.run]
include = [
    "backend/app/assessment.py",
    "backend/app/workflow.py",
    "backend/app/models.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
# models.py also holds the HTTP request/response contracts, which are interface code.
# The assessment domain models (Evidence, Dimension, Modality, Profile, Candidate,
# Assessment) remain measured. Excluding a class line excludes its whole body.
exclude_also = [
    "^class (AnalysisRequest|Decision|AnalysisResult)\\b",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
