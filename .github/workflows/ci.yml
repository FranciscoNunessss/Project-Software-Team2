name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deploy:
    # Explicit opt-in: no deployment until all cloud resources and secrets are configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUD_DEPLOY_ENABLED == 'true'
    needs: [containers, backend, removal-drill, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: cloud-production
      cancel-in-progress: false
    environment: production
    env:
      VITE_AUTH_MODE: supabase
      VITE_API_ORIGIN: ${{ vars.API_ORIGIN }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify deployment configuration before changing either service
        run: |
          python - <<'PY'
          import os
          required = ('VITE_API_ORIGIN', 'VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY',
                      'RENDER_SERVICE_ID', 'RENDER_API_KEY', 'NETLIFY_SITE_ID', 'NETLIFY_AUTH_TOKEN')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing deployment settings: ' + ', '.join(missing))
          PY
      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build the cloud frontend before deploying the backend
        run: pnpm build
        working-directory: frontend
      - name: Deploy the checked backend commit and wait for readiness
        run: python scripts/deploy_render.py
      - name: Check the public backend
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --max-time 120 "$VITE_API_ORIGIN/api/health"
      - name: Publish the prebuilt frontend
        working-directory: frontend
        run: npx --yes netlify-cli@27.16.2 deploy --prod --no-build --dir=dist --timeout=600
  containers:
    runs-on: ubuntu-latest
    env:
      # Only synthetic credentials/demo models; do not inject production secrets here.
      ADAPTAI_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the packaged stack
        run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 180
      - name: Check the frontend, API, authentication and SSE
        run: python scripts/check_containers.py --state-file "$RUNNER_TEMP/container-state.json"
      - name: Recreate the application containers and retain the encryption key
        run: |
          key_before=$(docker compose exec -T backend python -c "import hashlib; from pathlib import Path; print(hashlib.sha256(Path('/data/adaptai.credentials.key').read_bytes()).hexdigest())")
          docker compose --env-file .env.example up -d --force-recreate --wait --wait-timeout 120 backend frontend
          key_after=$(docker compose exec -T backend python -c "import hashlib; from pathlib import Path; print(hashlib.sha256(Path('/data/adaptai.credentials.key').read_bytes()).hexdigest())")
          test "$key_before" = "$key_after"
      - name: Verify login and data after recreation
        run: python scripts/check_containers.py --state-file "$RUNNER_TEMP/container-state.json" --verify-only
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove this runner's disposable stack
        if: always()
        run: docker compose down -v
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: adaptai
          POSTGRES_USER: adaptai
          POSTGRES_PASSWORD: adaptai
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U adaptai -d adaptai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADAPTAI_TEST_DATABASE_URL: postgresql://adaptai:adaptai@127.0.0.1:55432/adaptai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m ruff check backend scripts
      - run: uv run python -m ruff format --check backend scripts
      - run: uv run python -m pytest -q
  removal-drill:
    # Proves the optional modules, Prompt Coach (ADR-009) and chat (ADR-011), can be deleted
    # without touching the core.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: adaptai
          POSTGRES_USER: adaptai
          POSTGRES_PASSWORD: adaptai
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U adaptai -d adaptai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADAPTAI_TEST_DATABASE_URL: postgresql://adaptai:adaptai@127.0.0.1:55432/adaptai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Delete the Prompt Coach and chat modules
        run: >-
          rm -f backend/app/prompt_coach.py backend/tests/test_prompt_coach*.py
          scripts/check_prompt_coach.py backend/app/chat.py backend/tests/test_chat*.py
          scripts/check_chat.py
      - run: uv run python -m pytest -q -m "not prompt_coach and not chat"
      - name: Restart over a real database that still has Prompt Coach and chat data
        env:
          ADAPTAI_DATABASE_URL: postgresql://adaptai:adaptai@127.0.0.1:55432/adaptai
          ADAPTAI_DATABASE_SCHEMA: removal_drill
          ADAPTAI_CREDENTIALS_KEY_PATH: ${{ runner.temp }}/drill.key
        working-directory: backend
        run: |
          uv run python - <<'PY'
          from app.main import create_app
          from fastapi.testclient import TestClient

          app = create_app()
          store = app.state.storage
          assert TestClient(app).get("/api/health").status_code == 200
          with store.connect() as db:
              versions = db.execute("SELECT version,checksum FROM schema_migrations ORDER BY version").fetchall()
              db.execute("CREATE TABLE prompt_coach_events (id TEXT PRIMARY KEY, payload TEXT)")
              db.execute("INSERT INTO prompt_coach_events VALUES ('drill', '{}')")
              db.execute("CREATE TABLE chat_messages (id TEXT PRIMARY KEY, session_id TEXT, role TEXT, content TEXT)")
              db.execute("INSERT INTO chat_messages VALUES ('drill', 's', 'user', 'hi')")
          restarted = create_app()
          assert TestClient(restarted).get("/api/health").status_code == 200
          with restarted.state.storage.connect() as db:
              assert db.execute("SELECT version,checksum FROM schema_migrations ORDER BY version").fetchall() == versions
              assert db.execute("SELECT count(*) FROM chat_messages").fetchone()[0] == 1
          print("removal drill ok")
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  e2e:
    # Browser tests against the real app with fake models (e2e/server.py); no API keys needed.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: adaptai
          POSTGRES_USER: adaptai
          POSTGRES_PASSWORD: adaptai
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U adaptai -d adaptai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADAPTAI_TEST_DATABASE_URL: postgresql://adaptai:adaptai@127.0.0.1:55432/adaptai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - name: Install Chromium for Playwright
        working-directory: e2e
        # Ubuntu's package mirrors sometimes fail to resolve on the runner. The runner image
        # already has Chromium's libraries (apt only adds optional fonts), so retry the full
        # install, then fall back to the browser alone, which comes from Playwright's CDN.
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install --with-deps failed (attempt $attempt)"
            sleep 15
          done
          pnpm exec playwright install chromium
      - run: pnpm exec playwright test
        working-directory: e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: e2e/playwright-report
          retention-days: 7
